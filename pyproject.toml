[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Satellite Flood Damage Mapping & Rescue Prioritization Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Triage Team" }
]
keywords = [
    "satellite",
    "disaster-response",
    "flood-mapping",
    "sentinel-1",
    "sentinel-2",
    "rescue-intelligence",
    "geospatial",
    "remote-sensing"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "networkx>=3.0",
    "osmnx>=1.8.0",
    "pysheds>=0.3.0",
    "torch>=2.0.0",
    "segmentation-models-pytorch>=0.3.3",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "sentinelsat>=1.2.0",
    "openeo>=0.20.0",
    "streamlit>=1.25.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.13.0",
    "jinja2>=3.1.2",
    "weasyprint>=60.0",
    "pytest>=7.4.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
triage = "backend.triage.pipeline:main"
triage-case-study = "run_case_study:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frontend*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

